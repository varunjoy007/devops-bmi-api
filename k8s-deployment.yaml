apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmi-api-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bmi-api
  template:
    metadata:
      labels:
        app: bmi-api
    spec:
      containers:
      - name: bmi-api
        image: bmi-api:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bmi-api-service
spec:
  type: NodePort
  selector:
    app: bmi-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30080
