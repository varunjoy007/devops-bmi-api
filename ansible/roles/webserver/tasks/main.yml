---
- name: Ensure target application directory exists
  file:
    path: "{{ app_dir }}"
    state: directory
    mode: '0755'

- name: Copy BMI application and requirements
  copy:
    src: "{{ playbook_dir }}/../{{ item }}"
    dest: "{{ app_dir }}/{{ item }}"
  loop:
    - app.py
    - requirements.txt
  notify: Restart BMI API

- name: Install Python dependencies inside virtualenv
  pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_dir }}/venv"
    virtualenv_command: python3 -m venv
  notify: Restart BMI API
